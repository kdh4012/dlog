spring:
  application:
    name: dlog
  profiles:
    # 프로파일 미지정 시(IDE 실행 등) local 로 동작. 운영(Docker)은 SPRING_PROFILES_ACTIVE=prod
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dlog}
    username: ${DB_USERNAME:dlog}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 로만 관리
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

# 운영 환경은 반드시 환경 변수로 주입 (기본값 없음)
dlog:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  admin:
    username: ${ADMIN_USERNAME}
    password-hash: ${ADMIN_PASSWORD_HASH}
