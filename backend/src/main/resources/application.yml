spring:
  application:
    name: dlog
  profiles:
    # 프로파일 미지정 시(IDE 실행 등) local 로 동작. 운영(Docker)은 SPRING_PROFILES_ACTIVE=prod
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dlog}
    username: ${DB_USERNAME:dlog}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 로만 관리
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

# 운영 환경은 반드시 환경 변수로 주입 (기본값 없음)
dlog:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  admin:
    username: ${ADMIN_USERNAME}
    password-hash: ${ADMIN_PASSWORD_HASH}
  # 자산 포트폴리오 외부 동기화. 키가 비어 있으면 해당 출처는 동기화하지 않는다.
  # 두 서비스 모두 API 를 호출하는 서버의 공인 IP 를 허용 IP 로 등록해야 한다.
  upbit:
    access-key: ${UPBIT_ACCESS_KEY:}
    secret-key: ${UPBIT_SECRET_KEY:}
  toss:
    client-id: ${TOSS_CLIENT_ID:}
    client-secret: ${TOSS_CLIENT_SECRET:}
  sync:
    interval: ${ASSET_SYNC_INTERVAL:PT10M}
  # 원화·달러 환산용 환율 (ECB 고시, 키 불필요). 1시간 캐시
  fx:
    base-url: https://api.frankfurter.dev
  # 관심 종목(미국 주식) 시세 (Yahoo Finance 차트 API, 키 불필요). 5분 캐시
  quote:
    base-url: https://query1.finance.yahoo.com
