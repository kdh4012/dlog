spring:
  datasource:
    url: jdbc:h2:mem:dlog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

dlog:
  jwt:
    secret: test-secret-key-0123456789abcdef0123456789
    expiration-minutes: 60
  admin:
    username: admin
    # 비밀번호: dlog1234
    password-hash: $2a$10$tCO36zFZcMjDQcCXFf7VI.43pA14A7tKk1/.xWDTcrEv09uFYQevG

  # 테스트는 외부 환율 API 를 호출하지 않는다 (연결 거부 → 환산 없이 요약)
  fx:
    base-url: http://127.0.0.1:9
  # 시세도 외부 호출 없음 (연결 거부 → 시세 없이 목록만)
  quote:
    base-url: http://127.0.0.1:9
