# DLog 앱 서빙 규칙. /etc/nginx/snippets/dlog-app.conf 로 설치되어 dlog 서버 블록에서 include 된다.

root /var/www/dlog;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location /api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
}

# 배포마다 바뀌는 index.html 은 매번 서버에 확인(변경 없으면 304)
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Vite 가 파일명에 해시를 붙이므로 오래 캐시해도 안전하다.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# React Router 경로(/posts/1 등)로 직접 접속해도 index.html 을 돌려준다.
location / {
    try_files $uri /index.html;
}
